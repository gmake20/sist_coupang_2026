<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

<div class="login-wrap">
<!-- 쿠팡 로고 -->
    <div class="logo-area">
      <img
        class="logo"
        src="./images/gnb/coupang-bi-brand-logo.jpg"
        alt="Coupang"
      >
    </div>


    <!-- 로그인 방식 -->
    <div class="tabs">

        <button
            class="tab active"
            type="button">
            이메일 로그인
        </button>

        <button
            class="tab"
            type="button"
            onclick="showMessage('휴대폰번호 로그인은 준비 중입니다.')">

            휴대폰번호 로그인

            <span class="new-badge">N</span>
        </button>

        <button
            class="tab"
            type="button"
            onclick="showMessage('QR코드 로그인은 준비 중입니다.')">

            QR코드 로그인

        </button>

    </div>

    <form
        class="form-area"
        action="/login"
        method="post"
        onsubmit="return validateLogin();">


        <!-- 아이디 -->
        <div class="input-box">

            <div class="input-icon mail">
                ✉
            </div>

            <input
                id="email"
                name="email"
                type="text"
                placeholder="아이디(이메일)"
                autocomplete="username"
                maxlength="200"
                required
            >

            <button
                class="clear-btn"
                type="button"
                onclick="clearEmail()"
                aria-label="입력 내용 삭제">

                ×

            </button>

        </div>


        <!-- 비밀번호 -->
        <div class="input-box">

            <div class="input-icon lock">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호"
                autocomplete="current-password"
                maxlength="100"
                required
            >

            <button
                id="eyeButton"
                class="eye-btn"
                type="button"
                onclick="togglePassword()"
                aria-label="비밀번호 표시">

                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>

            </button>

        </div>


        <!-- 오류 -->
        <div
            id="errorMessage"
            class="error-message">
        </div>


        <!-- 자동 로그인 / 찾기 -->
        <div class="options">

            <label class="auto-login">

                <input
                    type="checkbox"
                    name="autoLogin"
                    value="Y">

                자동 로그인

            </label>


            <button
                class="find-link"
                type="button"
                onclick="location.href='/find-account.html'">

                아이디·비밀번호 찾기

            </button>

        </div>


        <!-- 실제 로그인 -->
        <button
            class="login-btn"
            type="submit">

            로그인

        </button>


        <!-- 회원가입 -->
        <button
            class="join-btn"
            type="button"
            onclick="location.href='/join.html'">

            회원가입

        </button>


        <!-- 패스키 -->
        <div class="passkey-area">

            <div class="passkey-title">
                <span>
                    패스키를 쿠팡에 이미 등록했다면
                </span>
            </div>

            <button
                class="passkey-btn"
                type="button"
                onclick="showMessage('패스키 로그인은 준비 중입니다.')">

                패스키 로그인

            </button>

        </div>

    </form>


    <div class="footer">
        ©Coupang Corp. All rights reserved.
    </div>

</div>


<script>

/*
 * 이메일 입력 내용 삭제
 */
function clearEmail() {

    const email =
        document.getElementById("email");

    email.value = "";

    email.focus();
}


/*
 * 비밀번호 표시 / 숨김
 */
function togglePassword() {

    const password =
        document.getElementById("password");

    const eyeButton =
        document.getElementById("eyeButton");

    if (password.type === "password") {

        password.type = "text";

        eyeButton.textContent = "🙈";

    } else {

        password.type = "password";

        eyeButton.textContent = "👁";

    }
}


/*
 * 로그인 전 기본 검증
 */
function validateLogin() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const errorMessage =
        document.getElementById("errorMessage");


    errorMessage.style.display = "none";
    errorMessage.textContent = "";


    if (email === "") {

        errorMessage.textContent =
            "아이디(이메일)를 입력해주세요.";

        errorMessage.style.display = "block";

        document.getElementById("email").focus();

        return false;
    }


    if (password === "") {

        errorMessage.textContent =
            "비밀번호를 입력해주세요.";

        errorMessage.style.display = "block";

        document.getElementById("password").focus();

        return false;
    }


    return true;
}


/*
 * 준비되지 않은 기능 안내
 */
function showMessage(message) {
    alert(message);
}

</script>

</body>
</html>
