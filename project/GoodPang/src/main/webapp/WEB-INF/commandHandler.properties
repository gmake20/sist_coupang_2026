# URL <-> Handler class mapping
# DispatcherServlet reads this file (via web.xml init-param "mappingPath") to decide which Handler to run.
#
# Keys must match (requestURI - contextPath), and they are declared as <url-pattern> in web.xml too.
# The old servlets (ProductServlet / CategoryServlet / ProductOptionServlet) still exist but their
# @WebServlet annotations are commented out, because two servlets cannot share one URL.

/product=com.goodpang.command.ProductHandler
/category=com.goodpang.command.CategoryHandler
/option=com.goodpang.command.ProductOptionHandler
